<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koya Clinic | Appointments</title>
  <style>
    :root{--primary:#087f75;--dark:#143c42;--muted:#61777c;--bg:#f4f9f8;--border:#dce9e7}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{background:#fff;border-bottom:1px solid var(--border);padding:22px 7%;font-size:22px;font-weight:800}header span{color:var(--primary)}
    main{max-width:1120px;margin:58px auto;padding:0 22px}.hero{text-align:center;margin-bottom:34px}.eyebrow{margin:0 0 9px;color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.12em}.hero h1{margin:0 0 12px;font-size:clamp(32px,5vw,52px)}.hero p:not(.eyebrow){margin:0;color:var(--muted);font-size:18px}
    .panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 10px 35px rgba(20,60,66,.05)}.section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.section-heading h2{margin:0 0 7px;font-size:27px}.hint{margin:0;color:var(--muted);line-height:1.5}.refresh-button{width:auto;margin:0;padding:10px 17px;background:#fff;color:var(--primary);border:1px solid #a8cbc7;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.refresh-button:hover{background:#effaf8}
    .table-wrap{margin-top:24px;overflow-x:auto;border:1px solid var(--border);border-radius:12px}.appointments-table{width:100%;min-width:680px;border-collapse:collapse;text-align:left}.appointments-table th{padding:14px 16px;background:#f7fbfa;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}.appointments-table td{padding:17px 16px;border-top:1px solid var(--border);vertical-align:middle}.appointments-table tr.unavailable td{color:#a7b4b5}.appointment-date{font-weight:700}.appointment-time{color:var(--muted);font-size:14px}.availability{display:inline-flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}.availability:before{content:"";width:8px;height:8px;border-radius:50%;background:#2f9c89}.availability.unavailable:before{background:#aebbbc}.availability.your-booking{color:var(--primary);font-weight:700}.availability.your-booking:before{background:var(--primary)}
    .action-wrap{position:relative;text-align:right}.action-button{width:38px;height:36px;padding:0;margin:0;background:#fff;color:var(--dark);border:1px solid var(--border);border-radius:8px;font-size:22px;line-height:1;letter-spacing:2px;cursor:pointer}.action-button:hover{background:#effaf8;color:var(--primary)}.action-button:disabled{opacity:.35;cursor:not-allowed;background:#f7f9f9}.action-menu{position:fixed;z-index:20;min-width:190px;padding:6px;border:1px solid var(--border);border-radius:9px;background:#fff;box-shadow:0 12px 30px rgba(20,60,66,.15)}.action-menu[hidden]{display:none}.menu-item{width:100%;padding:10px 12px;margin:0;background:#fff;color:var(--dark);border:0;border-radius:6px;text-align:left;font:inherit;font-size:13px;cursor:pointer}.menu-item:hover{background:#effaf8;color:var(--primary)}
    .status{margin-top:18px;padding:13px;border-radius:9px;background:#effaf8;color:#075d55;overflow-wrap:anywhere}.status.error{background:#fff0f0;color:#a42323}.hidden{display:none!important}
    .modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px}.modal-backdrop{position:absolute;inset:0;background:rgba(10,35,38,.48)}.modal-card{position:relative;width:min(100%,500px);padding:30px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 70px rgba(10,35,38,.25)}.modal-close{position:absolute;top:14px;right:16px;width:32px;height:32px;padding:0;margin:0;background:transparent;color:var(--muted);border:0;font-size:28px;line-height:1;cursor:pointer}.modal-close:hover{background:#effaf8;color:var(--primary)}.modal-card h2{margin:0 0 8px;font-size:28px}.selected-appointment{margin:0 0 22px;padding:12px;border-radius:9px;background:#effaf8;color:#075d55;font-weight:650}label{display:block;margin:16px 0 7px;font-size:14px;font-weight:700}input{width:100%;padding:13px;border:1px solid #cddfdd;border-radius:9px;font:inherit;background:#fff}button[type=submit]{width:100%;padding:14px;margin-top:22px;background:var(--primary);color:#fff;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}button[type=submit]:hover{background:#056b63}button:disabled{opacity:.5;cursor:not-allowed}.modal-open{overflow:hidden}
    @media(max-width:700px){main{margin-top:35px;padding:0 14px}.panel{padding:18px}.section-heading{display:block}.refresh-button{margin-top:17px}.appointments-table{min-width:610px}}
  </style>
</head>
<body>
  <header>Koya <span>Clinic</span></header>
  <main>
    <section class="hero"><p class="eyebrow">PATIENT APPOINTMENTS</p><h1>Choose a time that works for you.</h1><p>View appointment availability, book a visit, or manage your booking.</p></section>
    <section class="panel appointments-panel">
      <div class="section-heading"><div><h2>Appointment slots</h2><p class="hint">Use the three-dot menu on an available slot to book it.</p></div><button id="loadBtn" class="refresh-button" type="button">Refresh</button></div>
      <div id="message" class="status hidden" role="status"></div><div id="slots" aria-live="polite">Loading appointments...</div>
    </section>
  </main>
  <div id="bookingModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" aria-label="Close" data-close-modal>×</button><p class="eyebrow">BOOK APPOINTMENT</p><h2 id="modalTitle">Confirm your visit</h2><p id="modalSlot" class="selected-appointment"></p>
      <form id="bookingForm"><label for="patientName">Full name</label><input id="patientName" autocomplete="name" placeholder="Enter your full name" required><label for="patientEmail">Email address</label><input id="patientEmail" type="email" autocomplete="email" placeholder="you@example.com" required><button id="bookBtn" type="submit">Confirm booking</button></form>
      <div id="modalMessage" class="status hidden" role="status"></div>
    </section>
  </div>
  <script>
    const slotsContainer=document.getElementById("slots"),loadBtn=document.getElementById("loadBtn"),message=document.getElementById("message"),modal=document.getElementById("bookingModal"),modalSlot=document.getElementById("modalSlot"),modalMessage=document.getElementById("modalMessage"),form=document.getElementById("bookingForm"),bookBtn=document.getElementById("bookBtn");
    let selectedSlot=null;
    function setStatus(el,text,error=false){el.textContent=text;el.className=error?"status error":"status"}
    async function apiRequest(path,options={}){const response=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const data=await response.json();if(!response.ok)throw new Error(data.error||"Request failed. Please try again.");return data}
    function day(v){return new Date(v).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})}
    function time(v){return new Date(v).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}
    function closeMenus(){document.querySelectorAll(".action-menu").forEach(menu=>menu.hidden=true)}
    function openModal(slot){selectedSlot=slot;modalSlot.textContent=slot.provider+" · "+day(slot.start)+" · "+time(slot.start);modalMessage.className="status hidden";modalMessage.textContent="";form.reset();modal.hidden=false;document.body.classList.add("modal-open");document.getElementById("patientName").focus()}
    function closeModal(){modal.hidden=true;document.body.classList.remove("modal-open");selectedSlot=null}
    async function loadSlots(){loadBtn.disabled=true;slotsContainer.textContent="Loading appointments...";try{const data=await apiRequest("/web/slots");slotsContainer.replaceChildren();if(!data.slots||data.slots.length===0){slotsContainer.textContent="No appointment slots are available right now.";return}const wrap=document.createElement("div"),table=document.createElement("table"),body=document.createElement("tbody");wrap.className="table-wrap";table.className="appointments-table";table.innerHTML="<thead><tr><th>Date</th><th>Time</th><th>Provider</th><th>Status</th><th>Actions</th></tr></thead>";
      data.slots.forEach(slot=>{const row=document.createElement("tr");if(!slot.available)row.className="unavailable";row.innerHTML="<td class='appointment-date'></td><td class='appointment-time'></td><td></td><td></td><td class='action-wrap'></td>";row.children[0].textContent=day(slot.start);row.children[1].textContent=time(slot.start);row.children[2].textContent=slot.provider;const badge=document.createElement("span");badge.className="availability "+(slot.available?"":"unavailable");badge.textContent=slot.available?"Available":"Unavailable";row.children[3].appendChild(badge);const action=document.createElement("button");action.type="button";action.className="action-button";action.textContent="⋯";action.setAttribute("aria-label","Book appointment on "+day(slot.start));action.disabled=!slot.available;const menu=document.createElement("div");menu.className="action-menu";menu.hidden=true;const item=document.createElement("button");item.type="button";item.className="menu-item";item.textContent="Book this appointment";item.addEventListener("click",()=>{closeMenus();openModal(slot)});menu.appendChild(item);action.addEventListener("click",event=>{event.stopPropagation();const wasHidden=menu.hidden;closeMenus();if(wasHidden){const rect=action.getBoundingClientRect();menu.hidden=false;const menuRect=menu.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(window.innerWidth-menuRect.width-8,rect.right-menuRect.width))+"px";menu.style.top=(rect.bottom+6)+"px";if(rect.bottom+menuRect.height+6>window.innerHeight)menu.style.top=Math.max(8,rect.top-menuRect.height-6)+"px"}else menu.hidden=true});row.children[4].append(action,menu);body.appendChild(row)});table.appendChild(body);wrap.appendChild(table);slotsContainer.appendChild(wrap)}catch(error){setStatus(message,error.message,true)}finally{loadBtn.disabled=false}}
    form.addEventListener("submit",async event=>{event.preventDefault();if(!selectedSlot)return;bookBtn.disabled=true;try{const booking=await apiRequest("/web/bookings",{method:"POST",headers:{"Idempotency-Key":crypto.randomUUID()},body:JSON.stringify({slot_id:selectedSlot.id,name:document.getElementById("patientName").value.trim(),email:document.getElementById("patientEmail").value.trim()})});closeModal();setStatus(message,"Booking confirmed. Your booking ID is "+booking.id+".");await loadSlots()}catch(error){setStatus(modalMessage,error.message,true)}finally{bookBtn.disabled=false}});
    loadBtn.addEventListener("click",loadSlots);document.querySelectorAll("[data-close-modal]").forEach(el=>el.addEventListener("click",closeModal));document.addEventListener("click",closeMenus);document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeMenus();if(!modal.hidden)closeModal()}});loadSlots();
  </script>
</body>
</html>
