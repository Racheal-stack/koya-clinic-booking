services:
  - type: web
    name: koya-clinic-booking
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /web/slots
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
